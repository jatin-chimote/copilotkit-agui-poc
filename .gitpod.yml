{
  "$schema": "https://raw.githubusercontent.com/gitpod-io/gitpod/main/components/gitpod-protocol/data/gitpod-schema.json",
  "tasks": [
    {
      "name": "Backend",
      "init": "cd backend && pip install -r requirements.txt",
      "command": "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    },
    {
      "name": "Frontend",
      "init": "cd frontend && npm install",
      "command": "cd frontend && npm run dev -- --host"
    }
  ],
  "ports": [
    {
      "port": 3000,
      "onOpen": "open-preview",
      "description": "Frontend"
    },
    {
      "port": 8000,
      "onOpen": "ignore",
      "description": "Backend API"
    }
  ],
  "vscode": {
    "extensions": [
      "ms-python.python",
      "dbaeumer.vscode-eslint",
      "esbenp.prettier-vscode"
    ]
  }
}
